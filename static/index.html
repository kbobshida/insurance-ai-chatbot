<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>保険ドキュメント AIチャット</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" type="image/svg+xml" href="icon-mark.svg">

    <!-- Design system tokens (color / type / spacing / radius / shadow / motion) -->
    <link rel="stylesheet" href="design-tokens.css">
    <!-- Application styles built on top of tokens -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="app-shell">
        <div id="chat-card" role="region" aria-label="チャット">

            <header class="app-header">
                <div class="brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 48 48" width="36" height="36">
                        <path d="M24 4 L42 10 L42 24 C42 34 34 42 24 44 C14 42 6 34 6 24 L6 10 Z" fill="#0b1d33"/>
                        <path d="M24 4 L42 10 L42 24 C42 34 34 42 24 44 C14 42 6 34 6 24 L6 10 Z" fill="none" stroke="#b88a3a" stroke-width="0.8" opacity="0.6"/>
                        <text x="24" y="31" text-anchor="middle" font-family="'Noto Serif JP', serif" font-weight="700" font-size="22" fill="#faf8f5">保</text>
                    </svg>
                </div>
                <div class="brand-copy">
                    <h1>保険ドキュメント AIチャット</h1>
                    <div class="eyebrow">Policy Assistant · ご契約のしおりに関する質問</div>
                </div>
            </header>

            <main id="chat-window" aria-live="polite" aria-atomic="false">
                <div class="chat-message ai-message">
                    <div class="avatar ai-avatar" aria-hidden="true">AI</div>
                    <div class="message-bubble ai-bubble">
                        こんにちは。ご契約のしおりやパンフレットに関するご質問をどうぞ。
                    </div>
                </div>

                <div id="example-questions">
                    <div class="eyebrow eyebrow--center">質問例</div>
                    <div class="example-chips">
                        <button type="button" class="example-btn">ロードアシストでレッカー搬送は何キロまで無料ですか？</button>
                        <button type="button" class="example-btn">レンタカー費用補償は事故と故障で日数が違いますか？</button>
                        <button type="button" class="example-btn">入院時選べるアシスト特約ではどんなサービスが選べますか？</button>
                    </div>
                </div>
            </main>

            <footer class="composer">
                <form id="chat-form" autocomplete="off">
                    <input
                        type="text"
                        id="user-input"
                        class="composer-input"
                        placeholder="質問を入力してください…"
                        aria-label="質問入力"
                    >
                    <button type="submit" id="send-button" class="composer-send">送信</button>
                </form>
            </footer>
        </div>

        <aside id="source-panel" aria-label="引用元">
            <div class="eyebrow">Citations</div>
            <h2 class="panel-title">引用元</h2>
            <div class="panel-rule" aria-hidden="true"></div>
            <div id="source-list">
                <p class="panel-placeholder">回答の根拠となった文書とページ番号が、こちらに表示されます。</p>
            </div>
        </aside>
    </div>

    <!-- Markdown parser -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- XSS sanitizer -->
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
    <!-- App logic -->
    <script src="script.js"></script>
</body>
</html>
