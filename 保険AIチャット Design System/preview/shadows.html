<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:32px;background:#faf8f5;font-family:'Noto Sans JP',sans-serif;}
.row{display:flex;gap:28px;align-items:center;}
.cell{display:flex;flex-direction:column;align-items:center;gap:10px;}
.box{width:130px;height:78px;background:#fff;border-radius:10px;border:1px solid #e6dfd5;}
.s1{box-shadow:0 1px 2px rgba(11,29,51,.05),0 1px 3px rgba(11,29,51,.04);}
.s2{box-shadow:0 2px 4px rgba(11,29,51,.06),0 4px 12px rgba(11,29,51,.05);}
.s3{box-shadow:0 8px 24px rgba(11,29,51,.10),0 2px 6px rgba(11,29,51,.05);}
.name{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#211d17;}
.sub{font-size:10px;color:#847a6b;}
</style></head><body>
<div class="row">
  <div class="cell"><div class="box s1"></div><div class="name">shadow-1</div><div class="sub">list items</div></div>
  <div class="cell"><div class="box s2"></div><div class="name">shadow-2</div><div class="sub">cards</div></div>
  <div class="cell"><div class="box s3"></div><div class="name">shadow-3</div><div class="sub">elevated</div></div>
</div>
</body></html>
