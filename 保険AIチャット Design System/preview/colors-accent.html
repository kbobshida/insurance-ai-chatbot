<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:20px;background:#faf8f5;}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px;}
.sw{border-radius:6px;height:92px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;box-sizing:border-box;color:#fff;}
.sw .n{font-size:11px;font-weight:500;font-family:'Noto Sans JP',sans-serif;}
.sw .h{font-size:10px;font-family:'IBM Plex Mono',monospace;opacity:.8;margin-top:2px;}
.lbl{font-family:'Noto Sans JP',sans-serif;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#847a6b;margin:6px 0;}
</style></head><body>
<div class="lbl">Navy — primary</div>
<div class="row">
  <div class="sw" style="background:#0b1d33"><div class="n">Navy 900</div><div class="h">#0B1D33</div></div>
  <div class="sw" style="background:#16375f"><div class="n">Navy 700 · accent</div><div class="h">#16375F</div></div>
  <div class="sw" style="background:#2e6aa6"><div class="n">Navy 500 · link</div><div class="h">#2E6AA6</div></div>
</div>
<div class="lbl">Deep Green — confirmation</div>
<div class="row">
  <div class="sw" style="background:#0f3d2e"><div class="n">Green 800</div><div class="h">#0F3D2E</div></div>
  <div class="sw" style="background:#19573f"><div class="n">Green 700</div><div class="h">#19573F</div></div>
  <div class="sw" style="background:#2b8765"><div class="n">Green 500</div><div class="h">#2B8765</div></div>
</div>
<div class="lbl">Gold — rare accent (citations only)</div>
<div class="row">
  <div class="sw" style="background:#9a7026"><div class="n">Gold 600</div><div class="h">#9A7026</div></div>
  <div class="sw" style="background:#b88a3a"><div class="n">Gold 500</div><div class="h">#B88A3A</div></div>
  <div class="sw" style="background:#ead8b2;color:#4a4337"><div class="n">Gold 200</div><div class="h" style="opacity:.7">#EAD8B2</div></div>
</div>
</body></html>
