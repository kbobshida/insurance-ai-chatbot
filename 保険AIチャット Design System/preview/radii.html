<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:#faf8f5;font-family:'Noto Sans JP',sans-serif;}
.row{display:flex;gap:20px;align-items:flex-end;flex-wrap:wrap;}
.cell{display:flex;flex-direction:column;align-items:center;gap:6px;}
.box{width:62px;height:62px;background:#f3efe9;border:1px solid #cec3b3;}
.name{font-family:'IBM Plex Mono',monospace;font-size:10px;color:#211d17;}
.px{font-family:'IBM Plex Mono',monospace;font-size:10px;color:#847a6b;}
</style></head><body>
<div class="row">
  <div class="cell"><div class="box" style="border-radius:2px"></div><div class="name">xs</div><div class="px">2px</div></div>
  <div class="cell"><div class="box" style="border-radius:4px"></div><div class="name">sm</div><div class="px">4px · bubble</div></div>
  <div class="cell"><div class="box" style="border-radius:6px"></div><div class="name">md</div><div class="px">6px · button</div></div>
  <div class="cell"><div class="box" style="border-radius:10px"></div><div class="name">lg</div><div class="px">10px · card</div></div>
  <div class="cell"><div class="box" style="border-radius:9999px"></div><div class="name">full</div><div class="px">avatar</div></div>
</div>
</body></html>
