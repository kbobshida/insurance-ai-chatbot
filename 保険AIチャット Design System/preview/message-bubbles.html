<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:22px;background:#faf8f5;font-family:'Noto Sans JP',sans-serif;}
.msg{display:flex;align-items:flex-start;margin-bottom:16px;max-width:90%;gap:12px;}
.user{margin-left:auto;flex-direction:row-reverse;}
.ai{margin-right:auto;}
.avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:'Noto Serif JP',serif;font-weight:700;font-size:14px;}
.ai .avatar{background:#0b1d33;color:#faf8f5;}
.user .avatar{background:#f3efe9;color:#211d17;border:1px solid #cec3b3;}
.bub{padding:12px 16px;line-height:1.7;font-size:15px;border-radius:4px;}
.ai .bub{background:#fff;color:#211d17;border:1px solid #e6dfd5;border-top:1px solid #16375f;}
.user .bub{background:#16375f;color:#faf8f5;}
</style></head><body>
<div class="msg ai">
  <div class="avatar">AI</div>
  <div class="bub">こんにちは。ご契約のしおりやパンフレットに関するご質問をどうぞ。</div>
</div>
<div class="msg user">
  <div class="avatar">私</div>
  <div class="bub">ロードアシストでレッカー搬送は何キロまで無料ですか？</div>
</div>
</body></html>
