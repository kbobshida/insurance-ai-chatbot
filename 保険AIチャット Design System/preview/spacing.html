<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:22px;background:#faf8f5;font-family:'Noto Sans JP',sans-serif;}
.row{display:flex;align-items:center;gap:14px;margin-bottom:10px;}
.bar{background:#16375f;height:12px;border-radius:1px;}
.lbl{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#211d17;width:80px;}
.px{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#847a6b;}
</style></head><body>
<div class="row"><span class="lbl">space-1</span><div class="bar" style="width:4px"></div><span class="px">4px</span></div>
<div class="row"><span class="lbl">space-2</span><div class="bar" style="width:8px"></div><span class="px">8px</span></div>
<div class="row"><span class="lbl">space-3</span><div class="bar" style="width:12px"></div><span class="px">12px</span></div>
<div class="row"><span class="lbl">space-4</span><div class="bar" style="width:16px"></div><span class="px">16px · card gutter</span></div>
<div class="row"><span class="lbl">space-6</span><div class="bar" style="width:24px"></div><span class="px">24px · interior padding</span></div>
<div class="row"><span class="lbl">space-8</span><div class="bar" style="width:32px"></div><span class="px">32px · section rhythm</span></div>
<div class="row"><span class="lbl">space-12</span><div class="bar" style="width:48px"></div><span class="px">48px · page gutter</span></div>
</body></html>
