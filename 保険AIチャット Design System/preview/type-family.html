<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:28px;background:#faf8f5;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:28px;}
.cell{display:flex;flex-direction:column;gap:8px;}
.big{font-size:56px;line-height:1.05;color:#0b1d33;}
.serif{font-family:'Noto Serif JP',serif;font-weight:700;}
.sans{font-family:'Noto Sans JP',sans-serif;font-weight:400;}
.mono{font-family:'IBM Plex Mono',monospace;font-weight:400;}
.lbl{font-family:'Noto Sans JP',sans-serif;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#847a6b;}
.mono-small{font-family:'IBM Plex Mono',monospace;font-size:28px;color:#0b1d33;}
</style></head><body>
<div class="grid">
  <div class="cell"><div class="big serif">保険 Aa</div><div class="lbl">Display · Noto Serif JP 700</div></div>
  <div class="cell"><div class="big sans">保険 Aa</div><div class="lbl">Body · Noto Sans JP 400</div></div>
  <div class="cell"><div class="mono-small">Aa 123 / p.42</div><div class="lbl">Mono · IBM Plex Mono 400</div></div>
  <div class="cell"><div style="font-family:'Noto Sans JP',sans-serif;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#847a6b;font-weight:500">Eyebrow / Meta</div><div class="lbl">Sans 500 · 0.12em tracking</div></div>
</div>
</body></html>
