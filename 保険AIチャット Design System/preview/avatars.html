<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:#faf8f5;font-family:'Noto Sans JP',sans-serif;display:flex;gap:28px;align-items:center;flex-wrap:wrap;}
.cell{display:flex;flex-direction:column;align-items:center;gap:10px;}
.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Noto Serif JP',serif;font-weight:700;}
.ai{background:#0b1d33;color:#faf8f5;}
.user{background:#f3efe9;color:#211d17;border:1px solid #cec3b3;}
.lbl{font-family:'IBM Plex Mono',monospace;font-size:10px;color:#847a6b;}
</style></head><body>
<div class="cell"><div class="avatar ai" style="width:36px;height:36px;font-size:14px;">AI</div><div class="lbl">AI · 36px</div></div>
<div class="cell"><div class="avatar user" style="width:36px;height:36px;font-size:14px;">私</div><div class="lbl">User · 36px</div></div>
<div class="cell"><div class="avatar ai" style="width:28px;height:28px;font-size:11px;">AI</div><div class="lbl">28px</div></div>
<div class="cell"><div class="avatar ai" style="width:48px;height:48px;font-size:18px;">AI</div><div class="lbl">48px</div></div>
</body></html>
