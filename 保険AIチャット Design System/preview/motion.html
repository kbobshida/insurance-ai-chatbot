<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:26px;background:#faf8f5;font-family:'Noto Sans JP',sans-serif;display:flex;gap:28px;flex-wrap:wrap;align-items:center;}
.bub{padding:12px 16px;background:#fff;border:1px solid #e6dfd5;border-top:1px solid #16375f;border-radius:4px;display:inline-flex;align-items:center;gap:6px;}
.dot{width:6px;height:6px;border-radius:50%;background:#16375f;display:inline-block;animation:pulse 1.2s infinite ease-in-out;}
.dot:nth-child(2){animation-delay:.2s;}
.dot:nth-child(3){animation-delay:.4s;}
@keyframes pulse{0%,60%,100%{opacity:.25;}30%{opacity:1;}}
.cell{display:flex;flex-direction:column;gap:8px;}
.lbl{font-family:'IBM Plex Mono',monospace;font-size:10px;color:#847a6b;}
.fade{animation:fu .24s cubic-bezier(.4,0,.2,1) forwards;opacity:0;transform:translateY(8px);}
@keyframes fu{to{opacity:1;transform:translateY(0);}}
.row{display:flex;align-items:flex-start;gap:12px;}
.avatar{width:32px;height:32px;border-radius:50%;background:#0b1d33;color:#faf8f5;display:flex;align-items:center;justify-content:center;font-family:'Noto Serif JP',serif;font-weight:700;font-size:12px;}
</style></head><body>
<div class="cell">
  <div class="row"><div class="avatar">AI</div><div class="bub"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div></div>
  <span class="lbl">Typing · 1.2s pulse</span>
</div>
<div class="cell">
  <div class="row fade"><div class="avatar">AI</div><div class="bub" style="font-size:14px;color:#211d17;">こんにちは。</div></div>
  <span class="lbl">Message entry · 240ms fadeInUp</span>
</div>
</body></html>
